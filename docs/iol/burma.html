<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>緬甸文字破譯解題模擬｜TOL</title>
  <link rel="icon" type="image/png" href="../me.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0f172a;
      --muted: #64748b;
      --paper: #f1f5f9;
      --white: #ffffff;
      --line: #e2e8f0;
      --rose: #e11d48;
      --rose-soft: #fff1f2;
      --indigo: #4f46e5;
      --indigo-soft: #eef2ff;
      --amber: #b45309;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans TC", sans-serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.6;
    }
    .mm { font-family: "Noto Sans Myanmar", "Noto Sans TC", sans-serif; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 18px 64px; }
    .back {
      display: inline-block;
      font-size: 0.82rem;
      color: var(--muted);
      text-decoration: none;
      margin-bottom: 16px;
    }
    .back:hover { color: var(--ink); }
    .card {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 1px 2px rgba(15,23,42,.04);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      padding: 22px 24px;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: clamp(1.25rem, 3vw, 1.7rem); }
    .sub { margin: 6px 0 0; color: var(--muted); font-size: 0.92rem; }
    .tabs {
      display: flex;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 10px;
      gap: 4px;
    }
    .tabs button {
      border: 0;
      background: transparent;
      font: inherit;
      font-size: 0.86rem;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--muted);
    }
    .tabs button.active-graph { background: var(--white); color: var(--rose); box-shadow: 0 1px 2px rgba(15,23,42,.08); }
    .tabs button.active-matrix { background: var(--white); color: var(--indigo); box-shadow: 0 1px 2px rgba(15,23,42,.08); }
    .alert {
      margin-top: 16px;
      background: #fffbeb;
      border: 1px solid #fde68a;
      color: #92400e;
      border-radius: 16px;
      padding: 16px 18px;
      font-size: 0.92rem;
    }
    .panel { margin-top: 16px; overflow: hidden; }
    .step-bar { padding: 18px 22px; }
    .step-bar.graph { background: var(--rose-soft); border-bottom: 1px solid #fecdd3; }
    .step-bar.matrix { background: var(--indigo-soft); border-bottom: 1px solid #c7d2fe; }
    .step-bar h2 { margin: 0; font-size: 1.05rem; }
    .step-bar.graph h2 { color: #881337; }
    .step-bar.matrix h2 { color: #312e81; }
    .step-bar p { margin: 8px 0 0; font-size: 0.9rem; white-space: pre-line; }
    .canvas {
      min-height: 460px;
      background: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
      padding: 12px;
    }
    svg { max-width: 100%; height: auto; }
    .matrix-body { padding: 22px; background: #f8fafc; overflow: auto; }
    table { width: 100%; border-collapse: collapse; background: var(--white); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    th, td { padding: 10px 12px; text-align: left; font-size: 0.88rem; border-bottom: 1px solid #f1f5f9; }
    th { background: #f8fafc; color: var(--muted); font-weight: 700; }
    th.center, td.center { text-align: center; }
    td.word { font-size: 1.1rem; font-weight: 700; }
    td.meaning { font-weight: 700; color: var(--indigo); }
    .hl-yellow { background: #fefce8; }
    .hl-indigo { background: #eef2ff; }
    .hl-green { background: #ecfdf5; }
    .check { font-weight: 900; }
    .formula {
      margin-top: 16px;
      background: #1e293b;
      color: #e2e8f0;
      border-radius: 12px;
      padding: 16px 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.84rem;
    }
    .formula h3 { margin: 0 0 12px; color: #a5b4fc; font-size: 0.88rem; }
    .row {
      background: #334155;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 8px;
    }
    .tag {
      display: inline-block;
      background: rgba(79,70,229,.45);
      color: white;
      border-radius: 6px;
      padding: 2px 8px;
      font-weight: 700;
    }
    .tag.green { background: rgba(5,150,105,.8); }
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      border-top: 1px solid var(--line);
      background: var(--white);
    }
    .nav button {
      font: inherit;
      font-size: 0.86rem;
      font-weight: 700;
      border: 0;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
    }
    .nav button:disabled { opacity: .4; cursor: not-allowed; }
    .prev { background: #f1f5f9; color: #334155; }
    .next-graph { background: var(--rose); color: white; }
    .next-matrix { background: var(--indigo); color: white; }
    .dots { display: flex; gap: 6px; }
    .dots span {
      width: 8px; height: 8px; border-radius: 99px; background: #cbd5e1;
    }
    .dots span.on-graph { background: var(--rose); }
    .dots span.on-matrix { background: var(--indigo); }
    @media (max-width: 700px) {
      .header { flex-direction: column; }
      th, td { font-size: 0.78rem; padding: 8px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← 回到語奧資源</a>

    <div class="card header">
      <div>
        <h1>文字破譯解題思維動態模擬</h1>
        <p class="sub">2019 TOL 台灣語奧 問題 6：緬甸文外來語（Script Decipherment）</p>
      </div>
      <div class="tabs" role="tablist">
        <button id="tab-graph" type="button" class="active-graph">圖表法</button>
        <button id="tab-matrix" type="button">矩陣與特徵法</button>
      </div>
    </div>

    <div class="alert">
      <strong>解題核心：從語義學跨界到書寫系統。</strong><br>
      這題考驗的不是詞彙的「意思組合」，而是「視覺符號」與「英文語音」的映射。矩陣提取音節長度與共用字母，圖表則建構字首與字尾網絡。
    </div>

    <div class="card panel" id="app"></div>
  </div>

<script>
const nodes = [
  { id: 'sym-ba', label: 'ဘာ (ba)', x: 450, y: 150, type: 'symbol' },
  { id: 'sym-a', label: 'အ (vowel)', x: 150, y: 150, type: 'symbol' },
  { id: 'sym-gy', label: 'ဂျ (j/gy)', x: 300, y: 300, type: 'symbol' },
  { id: 'sym-k', label: 'က (k)', x: 300, y: 450, type: 'symbol' },
  { id: 'w-nov', label: 'နိုဝင်ဘာ', eng: 'November', x: 500, y: 50, type: 'word' },
  { id: 'w-rub', label: 'ရော်ဘာ', eng: 'rubber', x: 550, y: 250, type: 'word' },
  { id: 'w-aun', label: 'အန်တီ', eng: 'auntie', x: 50, y: 50, type: 'word' },
  { id: 'w-egy', label: 'အီဂျစ်', eng: 'Egypt', x: 150, y: 250, type: 'word' },
  { id: 'w-jac', label: 'ဂျက်', eng: 'Jack', x: 450, y: 350, type: 'word' },
  { id: 'w-cof', label: 'ကော်ဖီ', eng: 'coffee', x: 150, y: 450, type: 'word' },
  { id: 'w-clu', label: 'ကလပ်', eng: 'club', x: 450, y: 500, type: 'word' },
];
const edges = [
  { source: 'w-nov', target: 'sym-ba', id: 'e1' },
  { source: 'w-rub', target: 'sym-ba', id: 'e2' },
  { source: 'w-aun', target: 'sym-a', id: 'e3' },
  { source: 'w-egy', target: 'sym-a', id: 'e4' },
  { source: 'w-egy', target: 'sym-gy', id: 'e5' },
  { source: 'w-jac', target: 'sym-gy', id: 'e6' },
  { source: 'w-cof', target: 'sym-k', id: 'e7' },
  { source: 'w-clu', target: 'sym-k', id: 'e8' },
];
const graphSteps = [
  { title: '步驟 1：提取重複的視覺符號', desc: '觀察緬甸文單詞，找出重複出現的「方塊」。例如：「ဘာ」在兩個詞中出現；「အ」在兩個詞開頭；「ဂျ」和「က」也各自出現兩次。我們將這些符號設為核心節點。' },
  { title: '步驟 2：音節長度與錨點定位', desc: '最長的是「နိုဝင်ဘာ」(3個方塊)，英文只有 November 是 3 音節，所以確定它是 November。這意味著共用的結尾「ဘာ」發音是 /ber/ 或 /ba/。' },
  { title: '步驟 3：透過共用節點進行連鎖解碼', desc: '連著「ဘာ」的另一個詞是「ရော်ဘာ」，對應有 /ber/ 結尾的 rubber（橡皮）。\n同時，auntie 和 Egypt 都是母音開頭，共用「အ」。而 Egypt 又跟 Jack 共用代表 /j/ 音的「ဂျ」。' },
  { title: '步驟 4：網絡完全解析', desc: '最後，帶有「က」(k 音) 的兩個詞，自然對應發音有 /k/ 的 coffee 與 club。圖表法利用「共用部件連線」將字體與音韻網路疊合。' },
];
const matrixSteps = [
  { title: '步驟 1：建立視覺特徵矩陣', desc: '不需懂緬文，我們只需像算數學一樣，計算每個單詞的「視覺方塊數（音節）」，並標記它們是否包含某些特殊的重複符號（如：結尾的 ဘာ、開頭的 အ）。' },
  { title: '步驟 2：音節長度配對（Syllable Length）', desc: '最明顯的特徵：唯一的三音節詞「နိုဝင်ဘာ」➔ 必然對應選項中唯一的 3 音節字 November。\n唯一的一音節詞「ဂျက်」➔ 對應 Jack 或 club。' },
  { title: '步驟 3：字根與語音特徵代換（Phonetic Substitution）', desc: '既然 နိုဝင်ဘာ = November，那結尾的 ဘာ = ber。\n尋找另一個有 ဘာ 結尾的字「ရော်ဘာ」，對應到 rub-ber（橡皮）。' },
  { title: '步驟 4：矩陣交集解密完成', desc: '有 အ（母音開頭）特徵的是 auntie, Egypt。\n有 ဂျ（j 音）特徵的是 Jack, Egypt。\n取交集：「အီဂျစ်」兼具母音與 j 音 ➔ 必然是 Egypt。其餘依此類推。' },
];
const matrixRows = [
  { word: 'နိုဝင်ဘာ', blocks: 3, endBa: true, startA: false, hasJ: false, hasK: false, meanings: ['?', 'November', 'November', 'November'] },
  { word: 'ရော်ဘာ', blocks: 2, endBa: true, startA: false, hasJ: false, hasK: false, meanings: ['?', '?', 'rubber', 'rubber'] },
  { word: 'အန်တီ', blocks: 2, endBa: false, startA: true, hasJ: false, hasK: false, meanings: ['?', '?', '?', 'auntie'] },
  { word: 'အီဂျစ်', blocks: 2, endBa: false, startA: true, hasJ: true, hasK: false, meanings: ['?', '?', '?', 'Egypt'] },
  { word: 'ဂျက်', blocks: 1, endBa: false, startA: false, hasJ: true, hasK: false, meanings: ['?', 'Jack', 'Jack', 'Jack'] },
  { word: 'ကော်ဖီ', blocks: 2, endBa: false, startA: false, hasJ: false, hasK: true, meanings: ['?', '?', '?', 'coffee'] },
  { word: 'ကလပ်', blocks: 2, endBa: false, startA: false, hasJ: false, hasK: true, meanings: ['?', '?', '?', 'club'] },
];

const state = { mode: 'graph', graphStep: 0, matrixStep: 0 };

function wordGloss(node, step) {
  if (step >= 1 && node.id === 'w-nov') return 'November';
  if (step >= 2 && node.id === 'w-rub') return 'rubber';
  if (step >= 2 && node.id === 'w-aun') return 'auntie';
  if (step >= 2 && node.id === 'w-egy') return 'Egypt';
  if (step >= 2 && node.id === 'w-jac') return 'Jack';
  if (step >= 3) return node.eng;
  return '?';
}

function nodeVisible(node, step) {
  if (step === 0 && node.type === 'word') return false;
  if (step === 1 && node.type === 'word' && node.id !== 'w-nov' && node.id !== 'w-rub') return false;
  if (step === 2 && node.type === 'word' && (node.id === 'w-cof' || node.id === 'w-clu')) return false;
  return true;
}

function edgeVisible(edge, step) {
  if (step < 1) return false;
  if (step === 1 && edge.id !== 'e1' && edge.id !== 'e2') return false;
  if (step === 2 && (edge.id === 'e7' || edge.id === 'e8')) return false;
  return true;
}

function check(on, color) {
  return on ? `<span class="check" style="color:${color}">✓</span>` : '–';
}

function renderGraph() {
  const step = state.graphStep;
  const s = graphSteps[step];
  const lines = edges.filter(e => edgeVisible(e, step)).map(e => {
    const a = nodes.find(n => n.id === e.source);
    const b = nodes.find(n => n.id === e.target);
    return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="6,6" />`;
  }).join('');
  const marks = nodes.filter(n => nodeVisible(n, step)).map(n => {
    const isSymbol = n.type === 'symbol';
    const shape = isSymbol
      ? `<rect x="${n.x - 35}" y="${n.y - 35}" width="70" height="70" rx="12" fill="#f43f5e" stroke="white" stroke-width="3" />`
      : `<circle cx="${n.x}" cy="${n.y}" r="35" fill="#3b82f6" stroke="white" stroke-width="3" />`;
    const main = isSymbol ? n.label.split(' ')[0] : n.label;
    const sub = isSymbol
      ? `<text x="${n.x}" y="${n.y + 25}" text-anchor="middle" font-size="12" fill="#ffe4e6" font-weight="700">${n.label.split(' ')[1]}</text>`
      : (step >= 1 ? `<text x="${n.x}" y="${n.y + 20}" text-anchor="middle" font-size="14" fill="#bfdbfe" font-weight="700">${wordGloss(n, step)}</text>` : '');
    return `<g>
      ${shape}
      <text x="${n.x}" y="${n.y + (isSymbol ? 5 : -5)}" text-anchor="middle" font-size="${isSymbol ? 18 : 20}" font-weight="700" fill="white">${main}</text>
      ${sub}
    </g>`;
  }).join('');
  return `
    <div class="step-bar graph"><h2>${s.title}</h2><p class="mm">${s.desc}</p></div>
    <div class="canvas">
      <svg viewBox="0 0 650 550" width="650" height="550">${lines}${marks}</svg>
    </div>
    ${nav('graph', step, 3)}
  `;
}

function rowClass(row, step) {
  if (step === 1 && (row.blocks === 3 || row.word === 'ဂျက်')) return 'hl-yellow';
  if (step === 2 && row.endBa) return 'hl-indigo';
  if (step === 3 && (row.startA || row.hasJ || row.hasK)) return 'hl-green';
  return '';
}

function renderMatrix() {
  const step = state.matrixStep;
  const s = matrixSteps[step];
  const rows = matrixRows.map(row => `
    <tr class="${rowClass(row, step)}">
      <td class="word mm">${row.word}</td>
      <td class="center">${row.blocks}</td>
      <td class="center">${check(row.endBa, '#4f46e5')}</td>
      <td class="center">${check(row.startA, '#e11d48')}</td>
      <td class="center">${check(row.hasJ, '#d97706')}</td>
      <td class="center">${check(row.hasK, '#0d9488')}</td>
      <td class="meaning">${row.meanings[step]}</td>
    </tr>`).join('');
  let formula = '';
  if (step >= 1) {
    formula = `<div class="formula mm"><h3>特徵交集推導（Feature Intersection）</h3>
      <div class="row"><span style="color:#fde68a">Length = 3：</span> နိုဝင်ဘာ ➔ <span class="tag">November</span></div>
      ${step >= 2 ? '<div class="row"><span style="color:#c7d2fe">Suffix [ဘာ]：</span> 從 November 得知 ဘာ = /ber/。剩下 ရော်ဘာ ➔ <span class="tag">rubber</span></div>' : ''}
      ${step >= 3 ? `<div class="row">
        <div style="color:#6ee7b7;font-size:.75rem;margin-bottom:6px">// 矩陣特徵多重交集</div>
        <div>1. Prefix [အ] = 母音開頭（auntie, Egypt）</div>
        <div>2. Contain [ဂျ] = 含有 /j/ 音（Jack, Egypt）</div>
        <div style="margin-top:8px;padding-top:8px;border-top:1px solid #475569">交集確認：အီဂျစ် = <span class="tag green">Egypt</span></div>
      </div>` : ''}
    </div>`;
  }
  return `
    <div class="step-bar matrix"><h2>${s.title}</h2><p class="mm">${s.desc}</p></div>
    <div class="matrix-body">
      <table>
        <thead>
          <tr>
            <th>緬文單詞</th>
            <th class="center">視覺方塊（音節）</th>
            <th class="center">結尾 ဘာ (ba)</th>
            <th class="center">開頭 အ (a)</th>
            <th class="center">含 ဂျ (j)</th>
            <th class="center">含 က (k)</th>
            <th>破譯英文</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
      ${formula}
    </div>
    ${nav('matrix', step, 3)}
  `;
}

function nav(mode, step, max) {
  const on = mode === 'graph' ? 'on-graph' : 'on-matrix';
  const next = mode === 'graph' ? 'next-graph' : 'next-matrix';
  const dots = [0,1,2,3].map(i => `<span class="${i === step ? on : ''}"></span>`).join('');
  return `<div class="nav">
    <button class="prev" data-act="prev" ${step === 0 ? 'disabled' : ''}>上一步</button>
    <div class="dots">${dots}</div>
    <button class="${next}" data-act="next" ${step === max ? 'disabled' : ''}>下一步</button>
  </div>`;
}

function render() {
  document.getElementById('app').innerHTML = state.mode === 'graph' ? renderGraph() : renderMatrix();
  document.getElementById('tab-graph').className = state.mode === 'graph' ? 'active-graph' : '';
  document.getElementById('tab-matrix').className = state.mode === 'matrix' ? 'active-matrix' : '';
}

document.getElementById('tab-graph').onclick = () => { state.mode = 'graph'; render(); };
document.getElementById('tab-matrix').onclick = () => { state.mode = 'matrix'; render(); };
document.getElementById('app').addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const key = state.mode === 'graph' ? 'graphStep' : 'matrixStep';
  state[key] = btn.dataset.act === 'next' ? Math.min(3, state[key] + 1) : Math.max(0, state[key] - 1);
  render();
});
render();
</script>
</body>
</html>
