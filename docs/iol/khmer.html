<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>高棉語語義分類解題模擬｜TOL</title>
  <link rel="icon" type="image/png" href="../me.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0f172a;
      --muted: #64748b;
      --paper: #f1f5f9;
      --white: #ffffff;
      --line: #e2e8f0;
      --orange: #ea580c;
      --orange-soft: #fff7ed;
      --teal: #0d9488;
      --teal-soft: #f0fdfa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans TC", sans-serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.6;
    }
    .km { font-family: "Noto Sans Khmer", "Noto Sans TC", sans-serif; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 18px 64px; }
    .back {
      display: inline-block;
      font-size: 0.82rem;
      color: var(--muted);
      text-decoration: none;
      margin-bottom: 16px;
    }
    .back:hover { color: var(--ink); }
    .card {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 1px 2px rgba(15,23,42,.04);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      padding: 22px 24px;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: clamp(1.25rem, 3vw, 1.7rem); }
    .sub { margin: 6px 0 0; color: var(--muted); font-size: 0.92rem; }
    .tabs {
      display: flex;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 10px;
      gap: 4px;
    }
    .tabs button {
      border: 0;
      background: transparent;
      font: inherit;
      font-size: 0.86rem;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--muted);
    }
    .tabs button.active-graph { background: var(--white); color: var(--orange); box-shadow: 0 1px 2px rgba(15,23,42,.08); }
    .tabs button.active-matrix { background: var(--white); color: var(--teal); box-shadow: 0 1px 2px rgba(15,23,42,.08); }
    .alert {
      margin-top: 16px;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #065f46;
      border-radius: 16px;
      padding: 16px 18px;
      font-size: 0.92rem;
    }
    .panel { margin-top: 16px; overflow: hidden; }
    .step-bar { padding: 18px 22px; }
    .step-bar.graph { background: var(--orange-soft); border-bottom: 1px solid #fed7aa; }
    .step-bar.matrix { background: var(--teal-soft); border-bottom: 1px solid #99f6e4; }
    .step-bar h2 { margin: 0; font-size: 1.05rem; }
    .step-bar.graph h2 { color: #9a3412; }
    .step-bar.matrix h2 { color: #115e59; }
    .step-bar p { margin: 8px 0 0; font-size: 0.9rem; white-space: pre-line; }
    .canvas {
      min-height: 460px;
      background: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
      padding: 12px;
    }
    svg { max-width: 100%; height: auto; }
    .matrix-body { padding: 22px; background: #f8fafc; overflow: auto; }
    table { width: 100%; border-collapse: collapse; background: var(--white); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    th, td { padding: 10px 12px; text-align: left; font-size: 0.88rem; border-bottom: 1px solid #f1f5f9; }
    th { background: #f8fafc; color: var(--muted); font-weight: 700; }
    th.center, td.center { text-align: center; }
    td.word { font-size: 1.05rem; font-weight: 700; }
    td.meaning { font-weight: 700; color: var(--teal); }
    .hl-yellow { background: #fefce8; }
    .hl-orange { background: #fff7ed; }
    .hl-red { background: #fef2f2; }
    .none { color: #ef4444; font-weight: 700; }
    .formula {
      margin-top: 16px;
      background: #1e293b;
      color: #e2e8f0;
      border-radius: 12px;
      padding: 16px 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.84rem;
    }
    .formula h3 { margin: 0 0 12px; color: #5eead4; font-size: 0.88rem; }
    .row {
      background: #334155;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 8px;
    }
    .tag {
      display: inline-block;
      background: rgba(220,38,38,.8);
      color: white;
      border-radius: 6px;
      padding: 2px 8px;
      font-weight: 700;
    }
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      border-top: 1px solid var(--line);
      background: var(--white);
    }
    .nav button {
      font: inherit;
      font-size: 0.86rem;
      font-weight: 700;
      border: 0;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
    }
    .nav button:disabled { opacity: .4; cursor: not-allowed; }
    .prev { background: #f1f5f9; color: #334155; }
    .next-graph { background: var(--orange); color: white; }
    .next-matrix { background: var(--teal); color: white; }
    .dots { display: flex; gap: 6px; }
    .dots span { width: 8px; height: 8px; border-radius: 99px; background: #cbd5e1; }
    .dots span.on-graph { background: var(--orange); }
    .dots span.on-matrix { background: var(--teal); }
    @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @media (max-width: 700px) {
      .header { flex-direction: column; }
      th, td { font-size: 0.78rem; padding: 8px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← 回到語奧資源</a>

    <div class="card header">
      <div>
        <h1>語義分類解題思維動態模擬</h1>
        <p class="sub">2024 UKLO Round 1 問題 3：高棉語（Khmer）菜單破譯</p>
      </div>
      <div class="tabs" role="tablist">
        <button id="tab-graph" type="button" class="active-graph">圖表法</button>
        <button id="tab-matrix" type="button">矩陣與特徵法</button>
      </div>
    </div>

    <div class="alert">
      <strong>解題核心：從「句法結構」看見「語義分類」。</strong><br>
      英文的 Beef、Pork 在高棉語中必須拆成「肉 + 牛」「肉 + 豬」。但 Fish 前面不加「肉」。這種隱藏的語義分類詞，正是這題的關鍵。
    </div>

    <div class="card panel" id="app"></div>
  </div>

<script>
const nodes = [
  { id: 'bay', label: 'បាយ (bay)', eng: '飯', x: 100, y: 150, type: 'core' },
  { id: 'kuy', label: 'គុយទាវ (kuyteav)', eng: '粿條/麵', x: 100, y: 400, type: 'core' },
  { id: 'salat', label: 'សាឡាត់ (salat)', eng: '沙拉', x: 100, y: 280, type: 'core' },
  { id: 'cha', label: 'ឆា (cha)', eng: '炒', x: 250, y: 150, type: 'mod1' },
  { id: 'sut', label: 'ស៊ុត (sut)', eng: '蛋', x: 250, y: 400, type: 'mod1' },
  { id: 'sach', label: 'សាច់ (sach)', eng: '肉 (分類詞)', x: 400, y: 280, type: 'class' },
  { id: 'chruk', label: 'ជ្រូក (chruk)', eng: '豬', x: 550, y: 180, type: 'protein' },
  { id: 'ko', label: 'គោ (ko)', eng: '牛', x: 550, y: 380, type: 'protein' },
  { id: 'trey', label: 'ត្រី (trey)', eng: '魚', x: 550, y: 280, type: 'protein' },
];
const edges = [
  { source: 'bay', target: 'cha', label: '+ ឆា', id: 'e1' },
  { source: 'cha', target: 'sach', label: '+ សាច់', id: 'e2' },
  { source: 'kuy', target: 'sut', label: '+ ស៊ុត', id: 'e3' },
  { source: 'sut', target: 'sach', label: '+ សាច់', id: 'e4' },
  { source: 'salat', target: 'sach', label: '+ សាច់', id: 'e5' },
  { source: 'sach', target: 'chruk', label: '豬肉', id: 'e6' },
  { source: 'sach', target: 'ko', label: '牛肉', id: 'e7' },
  { source: 'salat', target: 'trey', label: '直接連接', id: 'e8' },
];
const colors = { core: '#3b82f6', mod1: '#10b981', class: '#f59e0b', protein: '#8b5cf6' };
const graphSteps = [
  { title: '步驟 1：確立主食核心節點', desc: '掃描語料字首，我們發現大量的「បាយ」（出現 5 次，對應 rice 飯）、「គុយទាវ」（出現 4 次，對應 noodles 麵）以及「សាឡាត់」（出現 2 次，對應 salad 沙拉）。它們是句子的起點。' },
  { title: '步驟 2：建構修飾語鏈條', desc: '高棉語是「由左至右」修飾。以飯為例：បាយ（飯）接上 ឆា（炒），變成「炒飯」。គុយទាវ（麵）接上 ស៊ុត（蛋），變成「雞蛋麵」。' },
  { title: '步驟 3：發現神祕的樞紐節點「សាច់ (sach)」', desc: '這題最精彩的地方來了：你會發現「炒飯」和「沙拉」要接續「牛、豬」之前，全部都要先經過一個高頻字「សាច់」（出現 6 次）。這個字正是「肉 (Meat)」。' },
  { title: '步驟 4：語義分類的例外（Exception）', desc: '觀察 fish salad（សាឡាត់ត្រី）：沙拉 (salat) 竟然直接連到魚 (trey)，中間沒有經過「肉 (sach)」。這證明了在高棉語的語義分類中，「魚」不屬於「肉類」。' },
];
const matrixSteps = [
  { title: '步驟 1：建立詞頻與位置矩陣', desc: '首先，計算高頻詞。បាយ（飯）出現 5 次，សាច់（肉）出現 6 次。特別注意它們的位置：បាយ 總是在句首 (Head)，而 សាច់ 總是在句中 (Middle)。' },
  { title: '步驟 2：核心語序代數推導', desc: '提取：សាឡាត់ត្រី = fish salad（沙拉+魚）；សាឡាត់សាច់គោ = beef salad（沙拉+肉+牛）。\n由此得出高棉語的公式：【名詞 + 修飾語】。' },
  { title: '步驟 3：發現「泛稱分類詞」的規律', desc: '矩陣揭露了一個重大差異：pork, beef, buffalo 都帶有 សាច់ (sach / 肉)。\n公式：sach（肉）+ ko（牛）= beef。\n公式：sach（肉）+ chruk（豬）= pork。' },
  { title: '步驟 4：利用空缺（Gaps）找出例外', desc: '在矩陣中，Fish（ត្រី）和 Tofu（តៅហ៊ូ）的「含 សាច់ (sach)」欄位是空白的（False）。\n結論：高棉語的 meat（សាច់）只用於陸地哺乳類，海鮮與素食不加此分類詞。' },
];
const matrixRows = [
  { word: 'បាយ (bay)', type: '主食', freq: 5, pos: '首 (Head)', hasSach: '-', meanings: ['?', 'Rice (飯)', 'Rice (飯)', 'Rice (飯)'] },
  { word: 'សាច់ (sach)', type: '樞紐', freq: 6, pos: '中 (Mid)', hasSach: '-', meanings: ['?', '?', 'Meat (肉)', 'Meat (肉)'] },
  { word: 'គោ (ko)', type: '食材', freq: 2, pos: '尾 (Tail)', hasSach: true, meanings: ['?', '?', 'Cow (牛)', 'Cow (牛)'] },
  { word: 'ជ្រូក (chruk)', type: '食材', freq: 2, pos: '尾 (Tail)', hasSach: true, meanings: ['?', '?', 'Pig (豬)', 'Pig (豬)'] },
  { word: 'ត្រី (trey)', type: '食材', freq: 2, pos: '尾 (Tail)', hasSach: false, meanings: ['?', 'Fish (魚)', 'Fish (魚)', 'Fish (魚)'] },
  { word: 'តៅហ៊ូ (tofu)', type: '食材', freq: 1, pos: '尾 (Tail)', hasSach: false, meanings: ['?', '?', '?', 'Tofu (豆腐)'] },
];

const state = { mode: 'graph', graphStep: 0, matrixStep: 0 };

function nodeVisible(node, step) {
  if (step === 0 && node.type !== 'core') return false;
  if (step === 1 && node.type === 'class') return false;
  if (step < 3 && node.id === 'trey') return false;
  return true;
}

function edgeVisible(edge, step) {
  if (step < 1) return false;
  if (edge.id === 'e8' && step < 3) return false;
  if (step === 1 && !['e1', 'e3', 'e5', 'e8'].includes(edge.id)) return false;
  return true;
}

function sachCell(val) {
  if (val === true) return '<span style="color:#ea580c;font-weight:900">✓</span>';
  if (val === false) return '<span class="none">X（無）</span>';
  return val;
}

function renderGraph() {
  const step = state.graphStep;
  const s = graphSteps[step];
  const lines = edges.filter(e => edgeVisible(e, step)).map(e => {
    const a = nodes.find(n => n.id === e.source);
    const b = nodes.find(n => n.id === e.target);
    const ex = e.id === 'e8';
    const mx = (a.x + b.x) / 2;
    const my = (a.y + b.y) / 2;
    const label = (step >= 2 && !ex)
      ? `<rect x="${mx - 30}" y="${my - 12}" width="60" height="24" rx="4" fill="white" stroke="#e2e8f0" />
         <text x="${mx}" y="${my + 4}" text-anchor="middle" font-size="11" fill="#475569" font-weight="700">${e.label}</text>`
      : '';
    return `<g>
      <line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"
        stroke="${ex ? '#ef4444' : '#cbd5e1'}" stroke-width="${ex ? 4 : 3}"
        stroke-dasharray="${ex ? '5,5' : 'none'}"
        marker-end="${ex ? 'url(#arrowhead-red)' : 'url(#arrowhead)'}" />
      ${label}
    </g>`;
  }).join('');
  const marks = nodes.filter(n => nodeVisible(n, step)).map(n => {
    const ring = (step >= 2 && n.type === 'class')
      ? `<circle cx="${n.x}" cy="${n.y}" r="45" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" style="transform-origin:${n.x}px ${n.y}px;animation:spinSlow 10s linear infinite" />`
      : '';
    const strokeW = (n.type === 'class' && step >= 2) ? 6 : 3;
    const stroke = (n.type === 'class' && step >= 2) ? '#fbbf24' : 'white';
    return `<g>
      ${ring}
      <circle cx="${n.x}" cy="${n.y}" r="30" fill="${colors[n.type]}" stroke="${stroke}" stroke-width="${strokeW}" />
      <text x="${n.x}" y="${n.y - 38}" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">${n.label.split(' ')[0]}</text>
      <text x="${n.x}" y="${n.y + 5}" text-anchor="middle" font-size="12" font-weight="700" fill="white">${n.eng.split(' ')[0]}</text>
    </g>`;
  }).join('');
  return `
    <div class="step-bar graph"><h2>${s.title}</h2><p class="km">${s.desc}</p></div>
    <div class="canvas">
      <svg viewBox="0 0 650 550" width="650" height="550">
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="25" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
          </marker>
          <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="25" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444" />
          </marker>
        </defs>
        ${lines}${marks}
      </svg>
    </div>
    ${nav('graph', step, 3)}
  `;
}

function rowClass(row, step) {
  if (step === 1 && row.freq >= 5) return 'hl-yellow';
  if (step === 2 && row.hasSach === true) return 'hl-orange';
  if (step === 3 && row.hasSach === false) return 'hl-red';
  return '';
}

function renderMatrix() {
  const step = state.matrixStep;
  const s = matrixSteps[step];
  const rows = matrixRows.map(row => `
    <tr class="${rowClass(row, step)}">
      <td class="word km">${row.word}</td>
      <td class="center">${row.type}</td>
      <td class="center">${row.freq}</td>
      <td class="center">${row.pos}</td>
      <td class="center">${sachCell(row.hasSach)}</td>
      <td class="meaning">${row.meanings[step]}</td>
    </tr>`).join('');
  let formula = '';
  if (step >= 1) {
    formula = `<div class="formula km"><h3>語法與分類詞代數（Syntax &amp; Classifier Logic）</h3>
      <div class="row">
        <div style="color:#fde68a">Word Order Check:</div>
        <div>សាឡាត់ (salat) + ត្រី (trey) = fish salad</div>
        <div>➔ Noun (Head) + Modifier (Tail)</div>
      </div>
      ${step >= 2 ? `<div class="row">
        <div style="color:#fdba74">សាច់ (sach):</div>
        <div>sach + ko（牛）= beef</div>
        <div>sach + chruk（豬）= pork</div>
      </div>` : ''}
      ${step >= 3 ? `<div class="row">
        <div style="color:#fca5a5;font-size:.75rem;margin-bottom:6px">// 語義分類例外偵測</div>
        <div>If fish = ត្រី (trey), why not សាច់ត្រី (sach trey)?</div>
        <div style="margin-top:8px;padding-top:8px;border-top:1px solid #475569">解答：<span class="tag">高棉語將「魚／豆腐」排除在「肉類 (sach)」分類之外</span></div>
      </div>` : ''}
    </div>`;
  }
  return `
    <div class="step-bar matrix"><h2>${s.title}</h2><p class="km">${s.desc}</p></div>
    <div class="matrix-body">
      <table>
        <thead>
          <tr>
            <th>高棉語單詞</th>
            <th class="center">詞類</th>
            <th class="center">頻率</th>
            <th class="center">位置</th>
            <th class="center">前置「សាច់」（肉）</th>
            <th>破譯語義</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
      ${formula}
    </div>
    ${nav('matrix', step, 3)}
  `;
}

function nav(mode, step, max) {
  const on = mode === 'graph' ? 'on-graph' : 'on-matrix';
  const next = mode === 'graph' ? 'next-graph' : 'next-matrix';
  const dots = [0,1,2,3].map(i => `<span class="${i === step ? on : ''}"></span>`).join('');
  return `<div class="nav">
    <button class="prev" data-act="prev" ${step === 0 ? 'disabled' : ''}>上一步</button>
    <div class="dots">${dots}</div>
    <button class="${next}" data-act="next" ${step === max ? 'disabled' : ''}>下一步</button>
  </div>`;
}

function render() {
  document.getElementById('app').innerHTML = state.mode === 'graph' ? renderGraph() : renderMatrix();
  document.getElementById('tab-graph').className = state.mode === 'graph' ? 'active-graph' : '';
  document.getElementById('tab-matrix').className = state.mode === 'matrix' ? 'active-matrix' : '';
}

document.getElementById('tab-graph').onclick = () => { state.mode = 'graph'; render(); };
document.getElementById('tab-matrix').onclick = () => { state.mode = 'matrix'; render(); };
document.getElementById('app').addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const key = state.mode === 'graph' ? 'graphStep' : 'matrixStep';
  state[key] = btn.dataset.act === 'next' ? Math.min(3, state[key] + 1) : Math.max(0, state[key] - 1);
  render();
});
render();
</script>
</body>
</html>
